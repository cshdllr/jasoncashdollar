name: Update Bookshelf

on:
  schedule:
    # Run every Monday at 9:17 AM UTC. Avoiding minute 0 reduces scheduler congestion.
    - cron: '17 9 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: update-bookshelf
  cancel-in-progress: false

jobs:
  update-books:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Test Goodreads importer
        run: node --test .github/scripts/fetch-books.test.js
          
      - name: Fetch and parse Goodreads RSS feed
        run: |
          node .github/scripts/fetch-books.js
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/books.json
          if git diff --staged --quiet; then
            echo "No bookshelf changes to commit"
          else
            git commit -m "Update bookshelf data from Goodreads RSS feed"
            git push
          fi
